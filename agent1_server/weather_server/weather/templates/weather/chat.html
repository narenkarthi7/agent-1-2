<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent 1 — Weather Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 820px; margin: 20px auto; padding: 0 12px; }
  #box { border: 1px solid #ccc; border-radius: 8px; height: 62vh; overflow-y: auto; padding: 10px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 95%; }
  .user { background: #dbeafe; margin-left: auto; width: fit-content; }
  .assistant { background: #f3f4f6; }
  table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  td, th { border: 1px solid #ccc; padding: 4px 8px; }
  .cards span { display: inline-block; background: #fff; border: 1px solid #ddd; border-radius: 6px;
                padding: 6px 10px; margin: 3px; }
  .chartbox { max-width: 520px; margin: 8px 0; }
  #row { display: flex; gap: 8px; margin-top: 10px; }
  #q { flex: 1; padding: 10px; }
  .hint { color: #666; font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<h2>🌤️ Agent 1 — Weather Intelligence</h2>
{% csrf_token %}
<p class="hint">Ask: "Weather in Chennai today" | "Weather in Bengaluru yesterday" |
  "Weather in London tomorrow" | "Last 10 days of weather in Chennai"</p>
<div id="box"></div>
<div id="row">
  <input id="q" placeholder="Ask about the weather..." maxlength="500">
  <button id="send">Send</button>
</div>

<script>
const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
const box = document.getElementById("box");
const COLORS = ["#3b82f6", "#f59e0b", "#10b981", "#ef4444", "#8b5cf6", "#6b7280"];

function chart(parent, type, labels, datasets, title) {
  const wrap = document.createElement("div"); wrap.className = "chartbox";
  const canvas = document.createElement("canvas"); wrap.appendChild(canvas); parent.appendChild(wrap);
  new Chart(canvas, { type, data: { labels, datasets },
                      options: { plugins: { title: { display: true, text: title } } } });
}

function table(parent, rows) {
  const keys = Object.keys(rows[0]);
  const t = document.createElement("table");
  t.innerHTML = "<tr>" + keys.map(k => `<th>${k}</th>`).join("") + "</tr>" +
    rows.map(r => "<tr>" + keys.map(k => `<td>${r[k]}</td>`).join("") + "</tr>").join("");
  parent.appendChild(t);
}

function showWeather(div, w) {
  const src = document.createElement("small");
  src.textContent = "Source: " + w.source; div.appendChild(src);
  if (w.current) {
    const cards = document.createElement("div"); cards.className = "cards";
    for (const [k, v] of Object.entries(w.current)) cards.innerHTML += `<span><b>${k}</b><br>${v}</span>`;
    div.appendChild(cards);
  }
  if (w.rows && w.rows.length) {
    table(div, w.rows);
    if (w.rows.length > 1) {
      const d = w.rows.map(r => r.date);
      chart(div, "line", d, [
        { label: "Max °C", data: w.rows.map(r => r.max_temp), borderColor: "#ef4444" },
        { label: "Min °C", data: w.rows.map(r => r.min_temp), borderColor: "#3b82f6" }], "Temperature trend");
      chart(div, "bar", d, [{ label: "Rain (mm)", data: w.rows.map(r => r.rain_mm),
                              backgroundColor: "#3b82f6" }], "Rainfall");
    }
  }
  if (w.pie) chart(div, "pie", Object.keys(w.pie),
                   [{ data: Object.values(w.pie), backgroundColor: COLORS }], "Weather conditions");
}

function addMessage(role, text, tool, extra) {
  const div = document.createElement("div"); div.className = "msg " + role;
  if (tool) { const s = document.createElement("small"); s.textContent = "🔧 Tool: " + tool; div.appendChild(s); }
  const p = document.createElement("p"); p.textContent = text; div.appendChild(p);
  if (extra && extra.weather) showWeather(div, extra.weather);
  box.appendChild(div); box.scrollTop = box.scrollHeight;
  return div;
}

async function send() {
  const input = document.getElementById("q"), question = input.value.trim();
  if (!question) return;
  input.value = ""; addMessage("user", question);
  const wait = addMessage("assistant", "Thinking...");
  const r = await fetch("/api/chat/", { method: "POST",
    headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
    body: JSON.stringify({ question }) });
  const data = await r.json(); wait.remove();
  addMessage("assistant", r.ok ? data.text : "⚠️ " + data.error, data.tool, data.extra);
}

document.getElementById("send").onclick = send;
document.getElementById("q").onkeydown = e => { if (e.key === "Enter") send(); };

fetch("/api/history/").then(r => r.json()).then(d =>
  d.messages.forEach(m => addMessage(m.role, m.text, m.tool, m.extra)));
</script>
</body>
</html>
