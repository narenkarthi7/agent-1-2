<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent 2 — Document Understanding</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 820px; margin: 20px auto; padding: 0 12px; }
  #box { border: 1px solid #ccc; border-radius: 8px; height: 56vh; overflow-y: auto; padding: 10px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 95%; }
  .user { background: #dbeafe; margin-left: auto; width: fit-content; }
  .assistant { background: #f3f4f6; }
  table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  td, th { border: 1px solid #ccc; padding: 4px 8px; }
  .card { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin: 8px 0; background: #fafafa; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  #q { flex: 1; padding: 10px; }
  .hint { color: #666; font-size: 13px; margin-top: 6px; }
  details { margin-top: 6px; }
  a { color: #2563eb; }
  .external { color: #b45309; font-weight: bold; }
</style>
</head>
<body>
<h2>📄 Agent 2 — Document Understanding</h2>
{% csrf_token %}
<p>📄 Upload resume (PDF/TXT): <input type="file" id="file" accept=".pdf,.txt">
   <span id="status"></span></p>
<p class="hint">Ask: "What are my skills?" | "Where did I study?" | "What projects have I done?"</p>
<div id="box"></div>
<div class="row">
  <input id="q" placeholder="Ask about your resume..." maxlength="500">
  <button id="send">Send</button>
</div>

<script>
const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
const box = document.getElementById("box");

function addMessage(role, text, tool, extra) {
  const div = document.createElement("div"); div.className = "msg " + role;
  if (tool) { const s = document.createElement("small"); s.textContent = "🔧 Tool: " + tool; div.appendChild(s); }
  const p = document.createElement("p"); p.textContent = text; div.appendChild(p);
  if (extra && extra.passages) {
    const det = document.createElement("details");
    det.innerHTML = "<summary>📌 Resume passages used</summary>";
    extra.passages.forEach(t => { const q = document.createElement("p"); q.textContent = t; det.appendChild(q); });
    div.appendChild(det);
  }
  if (extra && extra.web_fallback) {
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<span class="external">🌐 External info (NOT from your document):</span><br>${extra.web_fallback}`;
    if (extra.web_links) {
      extra.web_links.forEach(l => {
        const a = document.createElement("a"); a.href = l.url; a.target = "_blank";
        a.textContent = "🔗 " + l.title; card.appendChild(document.createElement("br")); card.appendChild(a);
      });
    }
    div.appendChild(card);
  }
  box.appendChild(div); box.scrollTop = box.scrollHeight;
  return div;
}

async function send() {
  const input = document.getElementById("q"), question = input.value.trim();
  if (!question) return;
  input.value = ""; addMessage("user", question);
  const wait = addMessage("assistant", "Thinking...");
  const r = await fetch("/api/chat/", { method: "POST",
    headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
    body: JSON.stringify({ question }) });
  const data = await r.json(); wait.remove();
  addMessage("assistant", r.ok ? data.text : "⚠️ " + data.error, data.tool, data.extra);
}

document.getElementById("send").onclick = send;
document.getElementById("q").onkeydown = e => { if (e.key === "Enter") send(); };

document.getElementById("file").onchange = async e => {
  const fd = new FormData(); fd.append("file", e.target.files[0]);
  const r = await fetch("/api/upload/", { method: "POST", headers: { "X-CSRFToken": csrf }, body: fd });
  const d = await r.json();
  document.getElementById("status").textContent = r.ok ? `✅ ${d.name} ready (${d.chunks} chunks)` : "⚠️ " + d.error;
};

fetch("/api/history/").then(r => r.json()).then(d =>
  d.messages.forEach(m => addMessage(m.role, m.text, m.tool, m.extra)));
</script>
</body>
</html>
